name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | sdkmanager --licenses || true

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies & Build Production Assets
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/
          rm -f android/app/src/main/assets/dist/server.cjs*

      - name: Prepare Android Keystore & Print Fingerprints
        run: |
          mkdir -p ~/.android android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from GitHub Secret ANDROID_KEYSTORE_BASE64"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            cp ~/.android/debug.keystore android/app/debug.keystore
          elif [ -f "android/app/debug.keystore.base64" ]; then
            echo "Using fixed repository keystore from android/app/debug.keystore.base64"
            base64 -d android/app/debug.keystore.base64 > ~/.android/debug.keystore
            cp ~/.android/debug.keystore android/app/debug.keystore
          elif [ -f "android/app/debug.keystore" ]; then
            cp android/app/debug.keystore ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore android/app/debug.keystore
          fi
          echo "================================================================"
          echo "=== ANDROID CERTIFICATE SHA-1 / SHA-256 FINGERPRINTS ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA256" || true
          echo "================================================================"

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x ./android/gradlew || true
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android APKs with Gradle Wrapper
        working-directory: android
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Stage and Rename APK Files
        run: |
          mkdir -p release_apks
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            cp "$RELEASE_APK" release_apks/Ludo_Royale_Release.apk
            cp "$RELEASE_APK" release_apks/Ludo_Arena_Release.apk
            cp "$RELEASE_APK" release_apks/Ludo_King_Realtime_Release.apk
          else
            echo "No Release APK found in android/app/build/outputs/apk/release"
          fi
          
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" release_apks/Ludo_Royale_Debug.apk
            cp "$DEBUG_APK" release_apks/Ludo_Arena_Debug.apk
            cp "$DEBUG_APK" release_apks/Ludo_King_Realtime_Debug.apk
          else
            echo "No Debug APK found in android/app/build/outputs/apk/debug"
          fi
          
          echo "Staged APKs:"
          ls -la release_apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ludo-APK-Builds
          path: release_apks/*.apk
          retention-days: 14

      - name: Publish Release Assets to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ludo Royale (Latest Release)"
          body: |
            ### Latest Ludo Android APKs
            Updated build signed with your verified Firebase SHA-1 certificate (`41:B2:88:3E:68:50:19:C8:C2:99:90:C4:FD:07:1F:7E:6F:E1:23:37`).
            
            **Available APK Downloads:**
            - **`Ludo_Royale_Release.apk`** (Production Release)
            - **`Ludo_Arena_Release.apk`** (Matches Firebase project public name)
            - **`Ludo_King_Realtime_Release.apk`** (Realtime multiplayer release)
            - **`Ludo_Royale_Debug.apk`** (Debug build)
          draft: false
          prerelease: false
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

