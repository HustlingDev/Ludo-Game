name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || chmod +x android/gradlew || true

      - name: Build Web Assets (if applicable)
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build || true
          fi

      - name: Build APK with Gradle
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace
          elif [ -d android ] && [ -f android/gradlew ]; then
            cd android && ./gradlew assembleRelease assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            **/build/outputs/apk/**/*.apk
          retention-days: 14
